<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safe Result — ClickGuard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #080b10;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .result-card {
      background-color: #111720;
      border: 1px solid rgba(34, 197, 94, 0.4);
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 35px rgba(34, 197, 94, 0.12);
    }
    .status-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: rgba(34, 197, 94, 0.15);
      border: 2px solid #22c55e;
      color: #22c55e;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      color: #22c55e;
      margin-bottom: 0.85rem;
    }
    .allowed-banner {
      display: inline-block;
      background-color: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #4ade80;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .back-btn {
      display: inline-block;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.65rem 1.35rem;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      background-color: #334155;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="result-card">
    <div class="status-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>PDF Download Successful</h1>
    <div class="allowed-banner">
      ClickGuard allowed this interaction.
    </div>
    <p>
      The browser agent successfully interacted with the legitimate document anchor. The target destination resolved cleanly without hidden redirects, transparent click-interceptors, or adversarial prompt injections.
    </p>
    <a href="safe.html" class="back-btn">&larr; Return to Safe Demo</a>
  </div>
</body>
</html>
